<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - AI-Based Duplicate Question Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0369a1 100%);
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2.5rem;
        }
        .brand-icon {
            width: 60px;
            height: 60px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.25rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-icon shadow-sm">
            <i class="bi bi-cpu-fill"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Faculty Portal</h4>
        <p class="text-muted small mb-0">AI-Based Duplicate Question Detection System</p>
    </div>

    <!-- Error / Logout Alerts -->
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center mb-3">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${errorMessage}">Invalid email or password</span>
    </div>

    <div th:if="${successMessage}" class="alert alert-success py-2 small d-flex align-items-center mb-3">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Logged out successfully</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary">Faculty Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" id="email" class="form-control border-start-0" 
                       placeholder="e.g. faculty@eec.srmrmp.edu.in" required autofocus>
            </div>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fw-semibold small text-secondary mb-0">Password</label>
            </div>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-shield-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control border-start-0 border-end-0" 
                       placeholder="••••••••" required>
                <button type="button" class="btn btn-light border border-start-0 toggle-password-btn" data-target="#password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small text-muted" for="rememberMe">
                    Remember my session
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
        </button>

        <!-- Demo Credentials Helper Box -->
        <div class="card bg-light border-0 rounded-3 p-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="badge bg-primary-subtle text-primary fw-bold" style="font-size: 0.72rem;">Demo Credentials</span>
                <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none small" onclick="fillDemoCredentials()">
                    <i class="bi bi-magic me-1"></i> Auto-Fill
                </button>
            </div>
            <div class="small text-muted" style="font-size: 0.78rem;">
                <div><strong>Email:</strong> <code th:text="${defaultEmail != null ? defaultEmail : 'faculty@eec.srmrmp.edu.in'}">faculty@eec.srmrmp.edu.in</code></div>
                <div><strong>Password:</strong> <code>Admin@123</code></div>
                <div><strong>Department:</strong> <span th:text="${defaultDepartment != null ? defaultDepartment : 'Artificial Intelligence and Data Science'}">Artificial Intelligence and Data Science</span></div>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
    function fillDemoCredentials() {
        const configuredEmail = /*[[${defaultEmail}]]*/ 'faculty@eec.srmrmp.edu.in';
        document.getElementById('email').value = configuredEmail || 'faculty@eec.srmrmp.edu.in';
        document.getElementById('password').value = 'Admin@123';
    }
</script>
</body>
</html>
