<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found - 404</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center p-5 card shadow-sm border-0" style="max-width: 500px;">
        <i class="bi bi-question-circle-fill text-warning display-1 mb-3"></i>
        <h3 class="fw-bold text-dark">404 - Resource Not Found</h3>
        <p class="text-secondary small mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested page or question was not found in the repository.'}">
            The requested page or question was not found.
        </p>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
