<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head}"></head>
<body>

<div th:replace="~{layout/base :: html(content=~{::content_fragment}, scripts=~{::scripts_fragment})}">
    <th:block th:fragment="content_fragment">
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/questions}">Question Bank</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Edit Question #<span th:text="${questionDto.id}">1</span></li>
                </ol>
            </nav>
            <h3 class="fw-bold mb-1 text-dark">Edit Question #<span th:text="${questionDto.id}">1</span></h3>
            <p class="text-secondary small mb-0">Update question parameters and synchronize semantic vector representations</p>
        </div>

        <div class="card card-academic p-4 shadow-sm" style="max-width: 800px;">
            <form th:action="@{/questions/edit/{id}(id=${questionDto.id})}" th:object="${questionDto}" method="post">
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger py-2 small mb-3">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> Please resolve form errors.
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Question Text <span class="text-danger">*</span></label>
                    <textarea th:field="*{questionText}" rows="4" class="form-control" 
                              th:classappend="${#fields.hasErrors('questionText')} ? 'is-invalid' : ''"></textarea>
                    <div class="invalid-feedback" th:errors="*{questionText}"></div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-7">
                        <label class="form-label fw-bold small text-dark">Subject <span class="text-danger">*</span></label>
                        <select th:field="*{subject}" class="form-select">
                            <option th:each="s : ${subjects}" th:value="${s}" th:text="${s}"></option>
                        </select>

                    </div>

                    <div class="col-md-5">
                        <label class="form-label fw-bold small text-dark">Unit <span class="text-danger">*</span></label>
                        <select th:field="*{unit}" class="form-select">
                            <option value="Unit I">Unit I</option>
                            <option value="Unit II">Unit II</option>
                            <option value="Unit III">Unit III</option>
                            <option value="Unit IV">Unit IV</option>
                            <option value="Unit V">Unit V</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-dark">Course Outcome (CO) <span class="text-danger">*</span></label>
                        <select th:field="*{courseOutcome}" class="form-select">
                            <option value="CO1">CO1</option>
                            <option value="CO2">CO2</option>
                            <option value="CO3">CO3</option>
                            <option value="CO4">CO4</option>
                            <option value="CO5">CO5</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-dark">Bloom's Taxonomy Level <span class="text-danger">*</span></label>
                        <select th:field="*{bloomLevel}" class="form-select">
                            <option value="Remember">Remember</option>
                            <option value="Understand">Understand</option>
                            <option value="Apply">Apply</option>
                            <option value="Analyze">Analyze</option>
                            <option value="Evaluate">Evaluate</option>
                            <option value="Create">Create</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-dark">Marks <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{marks}" class="form-control" min="1" max="30">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-dark">Difficulty <span class="text-danger">*</span></label>
                        <select th:field="*{difficulty}" class="form-select">
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-dark">Question Type <span class="text-danger">*</span></label>
                        <select th:field="*{questionType}" class="form-select">
                            <option value="Descriptive">Descriptive</option>
                            <option value="Short Answer">Short Answer</option>
                            <option value="Problem">Problem</option>
                            <option value="MCQ">MCQ</option>
                            <option value="Long Answer">Long Answer</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/questions}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 shadow-sm">
                        <i class="bi bi-save me-1"></i> Update Question
                    </button>
                </div>
            </form>
        </div>
    </th:block>

    <th:block th:fragment="scripts_fragment"></th:block>
</div>

</body>
</html>
