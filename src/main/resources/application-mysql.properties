# ===================================================================
# Production MySQL Configuration Profile
# Enable by setting: spring.profiles.active=mysql
# or via environment variables
# ===================================================================

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/question_detection_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
