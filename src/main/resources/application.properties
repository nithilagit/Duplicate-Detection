# ===================================================================
# AI-Based Duplicate Question Detection System
# Application Configuration
# ===================================================================

spring.application.name=duplicate-question-detection

# Default active profile (dev uses embedded persistent DB with MySQL syntax compatibility)
# To use a live MySQL server, set spring.profiles.active=mysql
spring.profiles.active=dev

# Server Port
server.port=8080

# -------------------------------------------------------------------
# Dev Profile Database Configuration (Embedded Persistent MySQL-Mode)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/questionbank;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# AI Duplicate Detection Settings (Configurable Thresholds)
# -------------------------------------------------------------------
# Similarity >= 85% -> HIGHLY SIMILAR / DUPLICATE (Red Warning)
app.similarity.threshold.high=85.0

# Similarity 70% - 84.99% -> SIMILAR / REVIEW REQUIRED (Orange Warning)
app.similarity.threshold.medium=70.0

# Top N recommendations to return
app.similarity.max-recommendations=5

# -------------------------------------------------------------------
# Default Demo Faculty Account & Institution
# -------------------------------------------------------------------
